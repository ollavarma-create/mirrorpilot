name: AppImage (experimental)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/appimage.yml'
      - 'packaging/**'
      - 'assets/**'
      - 'mirrorpilot/**'
      - 'tests/**'
      - 'pyproject.toml'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          python -m pip install --upgrade pip
          python -m pip install '.[test]' 'pyinstaller>=6.0,<7'
      - name: Run unit tests
        run: python -m pytest -q
      - name: Build AppImage
        run: bash packaging/build-appimage.sh
      - name: Validate AppDir layout
        run: |
          test -x dist/MirrorPilot.AppDir/AppRun
          test -x dist/MirrorPilot.AppDir/usr/bin/mirrorpilot
          test -f dist/MirrorPilot.AppDir/mirrorpilot.desktop
          test -f dist/MirrorPilot.AppDir/mirrorpilot.svg
          test -s dist/MirrorPilot.AppDir/mirrorpilot.png
          test -e dist/MirrorPilot.AppDir/.DirIcon
      - name: Check artifact and checksum
        run: |
          test -s dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirrorpilot-appimage-x86_64
          path: |
            dist/MirrorPilot-*.AppImage
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
