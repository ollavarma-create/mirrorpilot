name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            librsvg2-bin appstream patchelf ccache

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[test]' 'nuitka>=2.7,<3'

      - name: Tests
        run: |
          python -m compileall -q mirrorpilot scripts tests
          python -m pytest -q

      - name: Build AppImage
        run: bash packaging/build-appimage.sh

      - name: Upload AppImage
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: mirrorpilot-appimage-x86_64
          path: |
            dist/MirrorPilot-*.AppImage
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
