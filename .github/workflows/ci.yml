name: CI

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            librsvg2-bin appstream patchelf ccache

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[test]' 'nuitka>=4.1,<5'

      - name: Tests
        run: |
          python -m compileall -q mirrorpilot scripts tests
          python -m pytest -q

      - name: Build AppImage
        run: bash packaging/build-appimage.sh
          
      - name: Smoke test packaged AppImage (unsupported Ubuntu host)
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=3s 12s env \
            APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen \
            ./dist/MirrorPilot-*.AppImage > /tmp/mirrorpilot-smoke.log 2>&1
          status=$?
          set -e
          cat /tmp/mirrorpilot-smoke.log
          # The expected unsupported-OS QMessageBox stays open in offscreen Qt.
          # A timeout means the application reached its GUI event loop.
          if [[ "$status" -ne 124 ]]; then
            echo "AppImage smoke test failed: unexpected exit status $status" >&2
            exit 1
          fi
          if grep -Eiq 'Traceback|ImportError|ModuleNotFoundError|Segmentation fault|Could not load the Qt platform plugin|Aborted' /tmp/mirrorpilot-smoke.log; then
            echo "AppImage smoke test failed: startup error detected" >&2
            exit 1
          fi

      - name: Upload AppImage
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v5
        with:
          name: mirrorpilot-appimage-x86_64
          path: |
            dist/MirrorPilot-*.AppImage
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
